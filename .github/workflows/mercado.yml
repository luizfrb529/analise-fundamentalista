# Dados ao vivo do site, gravados no ramo "mercado" (um único commit, sobrescrito), sem mexer no histórico do main.
# O agendamento do GitHub atrasa várias horas e pula disparos, então o robô funciona em corrente:
# cada execução dura até ~5h45 e, ao terminar, dispara a próxima. De segunda a sexta, das 8h50 às 19h30 (Brasília),
# atualiza a cada 5 minutos (cotações da faixa e preço de tela) e, a cada hora, as notícias; fora desse horário só espera.
# A corrente para na sexta à noite e recomeça no domingo à noite pelos agendamentos abaixo, que também servem de reserva
# caso ela se rompa. A fila de concorrência garante uma execução por vez, então a corrente nunca se duplica.
name: cotacoes-faixa

on:
  schedule:
    - cron: "0 21 * * 0"      # domingo 18h: religa a corrente para a semana
    - cron: "0 1 * * 1"       # reserva (domingo 22h)
    - cron: "50 11 * * 1-5"   # reservas durante a semana
    - cron: "50 14 * * 1-5"
    - cron: "50 17 * * 1-5"
  push:
    branches: [main]
    paths: [".github/workflows/mercado.yml"]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: cotacoes-faixa
  cancel-in-progress: false

jobs:
  cotacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Atualizar em laço (pregão) e esperar fora dele
        env:
          TZ: America/Sao_Paulo
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          inicio=$(date +%s)
          limite=$(( inicio + 340*60 ))          # o GitHub encerra um job em 6 horas
          ultima_noticia=0
          rodada=0
          publicar() {
            ( cd saida
              rm -rf .git
              git init -q -b mercado
              git config user.name "atualizacao-automatica"
              git config user.email "actions@users.noreply.github.com"
              git add .
              git commit -q -m "Dados ao vivo de $(date '+%d/%m/%Y %H:%M')"
              git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mercado )
          }
          no_pregao() { local d h; d=$(date +%u); h=$(date +%H%M); [ "$d" -le 5 ] && [ "$h" -ge 0850 ] && [ "$h" -le 1930 ]; }
          mkdir -p saida
          curl -sf "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/mercado/noticias.json" -o saida/noticias.json || true
          while [ "$(date +%s)" -lt "$limite" ]; do
            if no_pregao || { [ "$rodada" -eq 0 ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; }; then
              agora=$(date +%s); rodada=$((rodada + 1))
              python pipeline/mercado.py saida/mercado.json || echo "falha nas cotações da faixa"
              python pipeline/ao_vivo.py precos saida/precos.json || echo "falha no preço de tela"
              if [ $(( agora - ultima_noticia )) -ge 3300 ]; then
                python pipeline/ao_vivo.py noticias saida/noticias.json.novo && mv saida/noticias.json.novo saida/noticias.json || echo "falha nas notícias"
                ultima_noticia=$agora
              fi
              publicar || echo "falha ao publicar"
              echo "rodada $rodada publicada às $(date +%H:%M)"
            fi
            # fim de semana: depois da sexta 19h30 a corrente para (volta no domingo à noite)
            d=$(date +%u); h=$(date +%H%M)
            if { [ "$d" -eq 5 ] && [ "$h" -gt 1935 ]; } || [ "$d" -eq 6 ] || { [ "$d" -eq 7 ] && [ "$h" -lt 1700 ]; }; then echo "fim de semana: corrente encerrada"; exit 0; fi
            sleep 300
          done
          # passa o bastão para a próxima execução
          curl -s -X POST -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mercado.yml/dispatches" -d '{"ref":"main"}' \
            && echo "próxima execução disparada"
