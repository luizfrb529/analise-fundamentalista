# Revisão automática do quadro "Sobre" das empresas.
# Todo dia útil, depois da atualização da manhã, revisa até MAX_PERFIS empresas que divulgaram resultado novo
# (ou cujo perfil tem mais de 120 dias), usando a IA da Anthropic com busca e leitura na web.
# Só funciona com o segredo ANTHROPIC_API_KEY cadastrado no repositório; sem ele, encerra sem fazer nada.
name: revisar-perfis

on:
  schedule:
    - cron: "30 14 * * 1-5"   # 11h30 em Brasília
    - cron: "30 19 * * 1-5"   # reserva (16h30)
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers separados por vírgula (vazio = os pendentes)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: revisar-perfis
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Revisar perfis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_PERFIS: "6"
          TZ: America/Sao_Paulo
        run: python pipeline/revisar_perfis.py --tickers "${{ github.event.inputs.tickers }}"

      - name: Publicar perfis revisados
        run: |
          git config user.name "atualizacao-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add data/perfis
          git diff --cached --quiet && { echo "nada a publicar"; exit 0; }
          git commit -m "Perfis revisados em $(date +%d/%m/%Y)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
