# Séries mensais do simulador "Retorno real e em dólar". O IBGE divulga o IPCA por volta do dia 10 do mês seguinte,
# então a rotina tenta do dia 10 ao 28 (folga para atraso na divulgação); no primeiro dia em que houver mês novo fechado ela grava, nos outros não muda nada.
name: retorno-mensal

on:
  schedule:
    - cron: "0 13 10-28 * *"   # 10h de Brasília, dias 10 a 28
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: retorno-mensal
  cancel-in-progress: false

jobs:
  mensal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Calcular o mês fechado (só se houver mês novo)
        run: python pipeline/retorno_mensal.py

      - name: Commit
        run: |
          git config user.name "atualizacao-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add data/mercado/mensal.json
          git diff --cached --quiet && exit 0
          git commit -m "Retorno mensal: mês fechado"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
