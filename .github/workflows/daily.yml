# Roda o pipeline nos dias úteis às 9h e às 18h30 (Brasília) e faz commit dos JSON.
# Na Fase 1 o arquivo já existe, mas só é usado depois que o projeto estiver num repositório do GitHub.
name: atualizar-dados

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 18h30 em Brasília: fechamento do pregão
    - cron: "0 12 * * 1-5"    # 9h em Brasília: aluguel da B3 do pregão anterior e documentos entregues à noite
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache filtrado da CVM e da SEC
        uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Testes das fórmulas
        run: cd pipeline && python -m pytest -q

      - name: Rodar pipeline
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          TZ: America/Sao_Paulo
        run: python pipeline/update.py

      - name: Logos de ativos novos
        run: python pipeline/logos.py

      - name: Commit dos dados
        run: |
          git config user.name "atualizacao-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add data relatorios assets/logos
          git diff --cached --quiet || git commit -m "Dados de $(date +%d/%m/%Y)"
          # se alguém publicou enquanto o robô rodava, junta antes de enviar (tenta até 3 vezes)
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
